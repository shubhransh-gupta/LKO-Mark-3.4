<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LKO Menu Bar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/menu.css">
</head>
<body class="menu-app-body">

  <div class="aerolite-container">

    <!-- TOP HEADER -->
    <header class="aero-header">
      <div class="aero-logo">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
          <path d="M12 4L4 12V28L12 36H28L36 28V12L28 4H12Z" fill="url(#logo-grad)" fill-opacity="0.15" stroke="url(#logo-grad)" stroke-width="2.5"/>
          <circle cx="20" cy="20" r="6" fill="#8b5cf6" />
          <defs>
            <linearGradient id="logo-grad" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
              <stop stop-color="#ffffff"/>
              <stop offset="0.5" stop-color="#a855f7"/>
              <stop offset="1" stop-color="#3b82f6"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="aero-brand">
        <div class="brand-title">LKO <span class="reg-sym">®</span></div>
        <div class="brand-sub">Neural Intelligence at Every Step.</div>
      </div>
    </header>

    <!-- NAVIGATION / ACTION PILLS -->
    <div class="aero-nav-list">
      
      <!-- Dashboard (Active Highlight) -->
      <button class="aero-nav-item active" id="btn-open-dashboard" title="Open Full Holographic HUD in Brave">
        <div class="nav-left">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
          </span>
          <span class="nav-label">Dashboard (HUD)</span>
        </div>
        <span class="nav-arrow">↗</span>
      </button>

      <!-- Slack Protocol -->
      <button class="aero-nav-item" id="btn-slack-dispatch">
        <div class="nav-left">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </span>
          <span class="nav-label">Slack Dispatch</span>
        </div>
        <span class="nav-chevron" id="slack-chevron">▼</span>
      </button>

      <!-- Inline Slack Drawer -->
      <div class="inline-drawer hidden" id="slack-drawer">
        <input type="text" id="slack-input" placeholder="e.g. general: Standup in 5 mins..." autocomplete="off">
        <button id="slack-submit-btn" class="drawer-btn">SEND</button>
      </div>

      <!-- Optical Vision Scanner -->
      <button class="aero-nav-item" id="btn-optical-scan">
        <div class="nav-left">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </span>
          <span class="nav-label">Optical Vision</span>
        </div>
        <span class="nav-badge" id="badge-optical">SCAN</span>
      </button>

      <!-- Mobile Remote Uplink -->
      <button class="aero-nav-item" id="btn-copy-mobile">
        <div class="nav-left">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
          </span>
          <span class="nav-label">Mobile Uplink</span>
        </div>
        <span class="nav-badge purple" id="badge-mobile-status">ONLINE</span>
      </button>

      <!-- Neural Engine -->
      <button class="aero-nav-item" id="btn-neural-engine">
        <div class="nav-left">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          </span>
          <span class="nav-label">Neural Engine</span>
        </div>
        <span class="nav-badge crown" id="badge-neural">⚡ 3.4GW</span>
      </button>

      <!-- 24/7 Daemon Toggle -->
      <button class="aero-nav-item" id="btn-toggle-daemon">
        <div class="nav-left">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          </span>
          <span class="nav-label">24/7 Background</span>
        </div>
        <span class="nav-badge green" id="badge-daemon">ON</span>
      </button>

      <!-- Support / Configuration -->
      <button class="aero-nav-item" id="btn-open-settings">
        <div class="nav-left">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
          </span>
          <span class="nav-label">Settings (.env)</span>
        </div>
        <span class="nav-arrow">⚙️</span>
      </button>

    </div>

    <!-- BOTTOM RADAR CARD -->
    <div class="aero-radar-card">
      <div class="radar-card-header">
        <span class="radar-title">Tracked Systems</span>
        <div class="radar-time-pill" id="radar-refresh-pill">
          <span>▼ LIVE</span>
        </div>
      </div>

      <!-- Circular Radar / Map Viewport -->
      <div class="radar-viewport">
        <div class="radar-compass-ring"></div>
        <div class="radar-grid-lines">
          <span class="c-point n">N</span>
          <span class="c-point s">S</span>
          <span class="c-point e">E</span>
          <span class="c-point w">W</span>
        </div>

        <!-- Radar Circuit Lines -->
        <svg class="radar-circuit-svg" viewBox="0 0 200 200">
          <path d="M30 140 C 60 135, 70 80, 110 90 S 160 130, 180 120" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.7"/>
          <path d="M50 70 C 80 80, 100 120, 150 110" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="3 3" fill="none" opacity="0.6"/>
        </svg>

        <!-- Tracking Target Nodes -->
        <div class="radar-node node-app" id="node-active-app" title="Active App">
          <div class="node-pulse"></div>
          <div class="node-dot">🍏</div>
          <span class="node-label" id="radar-app-name">Finder</span>
        </div>

        <div class="radar-node node-battery" id="node-battery" title="Battery Level">
          <div class="node-dot-small">🔋</div>
          <span class="node-label" id="radar-battery-val">85%</span>
        </div>

        <!-- Rotating Radar Sweep Line -->
        <div class="radar-sweep-beam"></div>
      </div>

      <!-- Quick Metrics Footer inside card -->
      <div class="radar-metrics-foot">
        <div class="m-box">
          <span class="m-lbl">ACTIVE APP:</span>
          <span class="m-val" id="foot-app">Finder</span>
        </div>
        <div class="m-box right">
          <span class="m-lbl">VOLUME:</span>
          <span class="m-val" id="foot-vol">50%</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Toast Feedback -->
  <div id="toast-notify" class="toast-popup hidden">Action Executed</div>

  <script src="/static/menu.js"></script>
</body>
</html>
